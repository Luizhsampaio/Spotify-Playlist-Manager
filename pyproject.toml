[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "music-curator"
version = "0.1.0"
description = "Curadoria musical pessoal: conexao local e leitura de playlists."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28.1,<1",
    "jinja2>=3.1.6,<4",
    "keyring>=25,<26",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "pywin32-ctypes>=0.2.3,<1; sys_platform == 'win32'",
    "typer>=0.15,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "detect-secrets>=1.5,<2",
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[project.scripts]
music-curator = "music_curator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
music_curator = ["templates/*.html", "static/*.css", "static/*.js", "static/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts/check_no_private_data.py", "scripts/check_secrets.py"]

[[tool.mypy.overrides]]
module = ["detect_secrets.*", "win32ctypes.*"]
ignore_missing_imports = true
